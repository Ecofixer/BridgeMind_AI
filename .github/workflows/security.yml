name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "20 1 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pip-audit>=2,<3"
      - name: Scan tracked files for common secrets
        run: python scripts/scan_secrets.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
