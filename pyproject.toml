[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-company-ai"
version = "0.1.0"
description = "A private founder and company AI operating assistant."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.52,<2",
  "openai>=3.3,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["founder_company_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
